      - path: src/main/java/com/example/billing/InvoiceCalculator.java
        startLine: 9
        endLine: 11
      - path: src/main/java/com/example/billing/InvoiceCalculator.java
        startLine: 27
        endLine: 32
      - path: web/src/api/client.ts
        startLine: 3
        endLine: 5
      - path: db/schema.sql
        startLine: 15
        endLine: 15
