corpus:
  name: fixture
  directory: eval/corpus/fixture
  manifest: eval/corpus/fixture.sha256

questions:
  - id: fx-01
    question: Where is calculateLateFee implemented?
    language: en
    category: EXACT_IDENTIFIER
    difficulty: EASY
    expected:
      - path: src/main/java/com/example/billing/InvoiceCalculator.java
        startLine: 34
        endLine: 41

  - id: fx-02
    question: Como o sistema evita processar o mesmo pagamento duas vezes?
    language: pt-BR
    category: CONCEPTUAL
    difficulty: HARD
    expected:
      - path: src/main/java/com/example/payments/PaymentWebhookHandler.java
        startLine: 19
        endLine: 31
    notes: Sinônimo sem termo em comum com o código (idempotencyKey, seenKeys); o lexical deve perder.

  - id: fx-03
    question: Onde está a função formatCurrency?
    language: pt-BR
    category: EXACT_IDENTIFIER
    difficulty: EASY
    expected:
      - path: web/src/utils/formatCurrency.ts
        startLine: 1
        endLine: 8
        otherPaths:
          - admin/src/utils/formatCurrency.ts
    notes: Mesmo conteúdo em dois caminhos; qualquer um dos dois conta.

  - id: fx-04
    question: How does a paid invoice end up in the monthly revenue report?
    language: en
    category: CROSS_FILE_FLOW
    difficulty: HARD
    expected:
      - path: src/main/java/com/example/payments/PaymentWebhookHandler.java
        startLine: 19
        endLine: 27
      - path: db/schema.sql
        startLine: 18
        endLine: 24
      - path: scripts/reports/monthly_revenue.py
        startLine: 8
        endLine: 37

  - id: fx-05
    question: Quais status uma fatura pode ter no banco de dados?
    language: pt-BR
    category: CONCEPTUAL
    difficulty: MEDIUM
    expected:
      - path: db/schema.sql
        startLine: 7
        endLine: 16
    notes: Pergunta em português (fatura) sobre código em inglês (invoices).

  - id: fx-06
    question: Which components make up the billing service?
    language: en
    category: ARCHITECTURE
    difficulty: EASY
    expected:
      - path: docs/architecture.md
        startLine: 1
        endLine: 13

  - id: fx-07
    question: Qual é o valor máximo permitido?
    language: pt-BR
    category: AMBIGUOUS
    difficulty: MEDIUM
