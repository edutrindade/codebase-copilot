        startLine: 3
        endLine: 4
    notes: Arquivo em UTF-8 com BOM; o BOM é removido antes do chunking e as linhas ficam preservadas.

  - id: fx-28
    question: What is the field layout of the legacy ERP export file?
    language: en
    category: UNANSWERABLE
    difficulty: MEDIUM
    mustAbstain: true
    notes: A resposta só existe em legacy/EXPORTACAO-ERP.txt, em Latin-1, que a varredura marca como INVALID_ENCODING e não indexa.

  - id: fx-29
    question: Quando o sistema antigo de cobrança será desligado?
    language: pt-BR
    category: UNANSWERABLE
    difficulty: MEDIUM
    mustAbstain: true
    notes: A resposta só existe em legacy/notas-migracao.txt, em UTF-16 com BOM, que não é indexado (hoje BINARY; INVALID_ENCODING depois da F5).

  - id: fx-30
