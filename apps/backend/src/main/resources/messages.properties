# User-facing messages (pt-BR, D-025).
# Every ErrorCode requires error.<CODE>.title and error.<CODE>.detail (D-022).

error.VALIDATION_FAILED.title=Requisição inválida
error.VALIDATION_FAILED.detail=A requisição contém campos inválidos.
error.MALFORMED_REQUEST.title=Requisição malformada
error.MALFORMED_REQUEST.detail=O corpo da requisição não pôde ser lido. Verifique o formato JSON e os tipos dos campos.
error.RESOURCE_NOT_FOUND.title=Recurso não encontrado
error.RESOURCE_NOT_FOUND.detail=O endereço solicitado não existe.
error.METHOD_NOT_ALLOWED.title=Método não permitido
error.METHOD_NOT_ALLOWED.detail=O método HTTP utilizado não é suportado por este endereço.
error.UNSUPPORTED_MEDIA_TYPE.title=Tipo de conteúdo não suportado
error.UNSUPPORTED_MEDIA_TYPE.detail=O tipo de conteúdo enviado não é suportado. Use application/json.
error.INTERNAL_ERROR.title=Erro interno
error.INTERNAL_ERROR.detail=Ocorreu um erro inesperado. Informe o requestId ao reportar o problema.
error.WORKSPACE_NOT_FOUND.title=Workspace não encontrado
error.WORKSPACE_NOT_FOUND.detail=O workspace informado não existe ou foi removido.
error.WORKSPACE_NOT_EMPTY.title=Workspace não está vazio
error.WORKSPACE_NOT_EMPTY.detail=Remova os projetos do workspace antes de removê-lo.
error.PROJECT_NOT_FOUND.title=Projeto não encontrado
error.PROJECT_NOT_FOUND.detail=O projeto informado não existe ou foi removido.
error.LOCAL_ROOTS_NOT_CONFIGURED.title=Nenhuma raiz local configurada
error.LOCAL_ROOTS_NOT_CONFIGURED.detail=O backend não tem raízes permitidas para pastas locais. Configure PROJECTS_ROOT ou use a importação por ZIP.
error.ROOT_NOT_FOUND.title=Raiz não encontrada
error.ROOT_NOT_FOUND.detail=A raiz informada não está configurada no backend.
error.PATH_OUTSIDE_ROOT.title=Caminho fora da raiz
error.PATH_OUTSIDE_ROOT.detail=O caminho deve ser relativo à raiz, sem barra inicial nem segmentos "..".
error.PROJECT_ALREADY_EXISTS.title=Projeto já existe
error.PROJECT_ALREADY_EXISTS.detail=Este workspace já tem um projeto para esta pasta.
error.DIRECTORY_NOT_FOUND.title=Diretório não encontrado
error.DIRECTORY_NOT_FOUND.detail=O diretório informado não existe nesta raiz.
error.DIRECTORY_NOT_READABLE.title=Diretório sem permissão de leitura
error.DIRECTORY_NOT_READABLE.detail=O backend não tem permissão para listar este diretório.
error.PROJECT_BUSY.title=Projeto ocupado
error.PROJECT_BUSY.detail=O projeto tem uma importação ou indexação em andamento. Aguarde a conclusão e tente novamente.
error.PROJECT_SOURCE_MISMATCH.title=Operação incompatível com a origem do projeto
error.PROJECT_SOURCE_MISMATCH.detail=Esta operação não está disponível para o tipo de origem deste projeto.
error.UPLOAD_TOO_LARGE.title=Arquivo grande demais
error.UPLOAD_TOO_LARGE.detail=O arquivo enviado excede o tamanho máximo permitido para importação.
error.IMPORT_NOT_FOUND.title=Importação não encontrada
error.IMPORT_NOT_FOUND.detail=A importação informada não existe ou foi removida.
error.SOURCE_ROOT_NOT_CONFIGURED.title=Raiz do projeto não configurada
error.SOURCE_ROOT_NOT_CONFIGURED.detail=A raiz usada por este projeto não está mais configurada no backend.
error.SOURCE_DIRECTORY_NOT_FOUND.title=Pasta do projeto não encontrada
error.SOURCE_DIRECTORY_NOT_FOUND.detail=A pasta do projeto não existe ou não é um diretório.
error.SOURCE_IS_SYMLINK.title=Pasta do projeto é um link simbólico
error.SOURCE_IS_SYMLINK.detail=O caminho do projeto passa por um link simbólico, que não é seguido por segurança.
error.SOURCE_NOT_READABLE.title=Pasta do projeto sem permissão de leitura
error.SOURCE_NOT_READABLE.detail=O backend não tem permissão para ler a pasta do projeto.
error.SOURCE_NOT_IMPORTED.title=Projeto sem importação concluída
error.SOURCE_NOT_IMPORTED.detail=Envie um arquivo ZIP e aguarde a conclusão da importação antes de consultar o inventário ou indexar.
error.INDEX_JOB_NOT_FOUND.title=Indexação não encontrada
error.INDEX_JOB_NOT_FOUND.detail=A indexação informada não existe ou foi removida.
error.SNAPSHOT_NOT_FOUND.title=Snapshot não encontrado
error.SNAPSHOT_NOT_FOUND.detail=O snapshot informado não existe ou foi removido.
error.SNAPSHOT_NOT_SEARCHABLE.title=Snapshot indisponível para busca
error.SNAPSHOT_NOT_SEARCHABLE.detail=O projeto não tem snapshot ativo, ou o snapshot informado ainda está em construção, falhou ou foi removido pela retenção. Indexe o projeto ou escolha outro snapshot.
error.SNAPSHOT_LEXICAL_MISMATCH.title=Snapshot sem o índice lexical atual
error.SNAPSHOT_LEXICAL_MISMATCH.detail=Este snapshot não tem índice lexical ou foi indexado com uma versão anterior da tokenização. Indexe o projeto novamente para usar a busca lexical ou híbrida.
error.EMBEDDINGS_NOT_AVAILABLE.title=Busca vetorial desativada
error.EMBEDDINGS_NOT_AVAILABLE.detail=Nenhum provedor de embeddings está configurado no backend. Configure EMBEDDING_PROVIDER para usar a busca vetorial ou híbrida, ou use o modo LEXICAL.
error.SNAPSHOT_EMBEDDING_MISMATCH.title=Snapshot incompatível com o modelo configurado
error.SNAPSHOT_EMBEDDING_MISMATCH.detail=Os vetores deste snapshot não foram gerados com o modelo de embeddings configurado. Indexe o projeto novamente para usar a busca.
error.CONVERSATION_NOT_FOUND.title=Conversa não encontrada
error.CONVERSATION_NOT_FOUND.detail=A conversa informada não existe neste projeto ou foi removida.
error.ANSWER_NOT_FOUND.title=Resposta não encontrada
error.ANSWER_NOT_FOUND.detail=A resposta informada não existe ou foi removida com o projeto.
error.EVIDENCE_NOT_FOUND.title=Evidência não encontrada
error.EVIDENCE_NOT_FOUND.detail=A evidência informada não existe neste projeto ou foi removida.
error.GENERATION_NOT_AVAILABLE.title=Geração de respostas desativada
error.GENERATION_NOT_AVAILABLE.detail=Nenhum provedor de geração está configurado no backend. Configure GENERATION_PROVIDER para fazer perguntas; a busca continua disponível.
error.SNAPSHOT_PRUNED.title=Snapshot removido pela retenção
error.SNAPSHOT_PRUNED.detail=Os arquivos deste snapshot foram removidos pela retenção de snapshots. A cópia do trecho de cada evidência continua disponível.
error.FILE_NOT_FOUND.title=Arquivo não encontrado
error.FILE_NOT_FOUND.detail=O arquivo informado não faz parte deste snapshot.
error.FILE_NOT_INDEXED.title=Arquivo sem conteúdo indexado
error.FILE_NOT_INDEXED.detail=Este arquivo não foi indexado (binário, codificação inválida, linha longa demais ou falha de leitura), então o conteúdo não está disponível.
error.FORBIDDEN_HOST.title=Endereço não permitido
error.FORBIDDEN_HOST.detail=O backend só atende requisições endereçadas a localhost. Acesse a aplicação por localhost ou 127.0.0.1.
error.FORBIDDEN_ORIGIN.title=Origem não permitida
error.FORBIDDEN_ORIGIN.detail=A requisição veio de uma página que não é a interface do Codebase Copilot e foi recusada por segurança.
error.EMBEDDING_PROVIDER_UNAVAILABLE.title=Provedor de embeddings indisponível
error.EMBEDDING_PROVIDER_UNAVAILABLE.detail=O provedor de embeddings está indisponível ou não respondeu a tempo. Tente novamente mais tarde.
error.EMBEDDING_PROVIDER_UNAUTHORIZED.title=Credencial do provedor recusada
error.EMBEDDING_PROVIDER_UNAUTHORIZED.detail=O provedor de embeddings recusou a credencial configurada no backend. Verifique EMBEDDING_API_KEY.
error.EMBEDDING_QUOTA_EXCEEDED.title=Cota do provedor esgotada
error.EMBEDDING_QUOTA_EXCEEDED.detail=A cota ou o limite de gastos da conta no provedor de embeddings foi atingido. Verifique os créditos e os limites da conta e tente novamente.
error.EMBEDDING_REQUEST_REJECTED.title=Pergunta recusada pelo provedor
error.EMBEDDING_REQUEST_REJECTED.detail=O provedor de embeddings recusou a pergunta. Reformule a pergunta ou verifique o modelo configurado.
error.EMBEDDING_RATE_LIMITED.title=Limite de requisições do provedor
error.EMBEDDING_RATE_LIMITED.detail=O provedor de embeddings limitou a taxa de requisições. Aguarde alguns instantes e tente novamente.

# Import job errors (GET /imports/{id}); never include names taken from the archive.
import.error.ZIP_INVALID=O arquivo não é um ZIP válido, está corrompido ou usa recursos não suportados (como criptografia).
import.error.ZIP_UNSAFE_PATH=O ZIP contém caminhos inseguros (absolutos, com "..", barra invertida, caracteres de controle ou longos demais).
import.error.ZIP_DUPLICATE_ENTRY=O ZIP contém entradas repetidas ou que diferem apenas por maiúsculas/minúsculas.
import.error.ZIP_TOO_MANY_ENTRIES=O ZIP contém mais entradas do que o limite permitido.
import.error.ZIP_ENTRY_TOO_LARGE=O ZIP contém um arquivo maior do que o limite permitido.
import.error.ZIP_UNCOMPRESSED_TOO_LARGE=O conteúdo descompactado do ZIP excede o tamanho máximo permitido.
import.error.ZIP_COMPRESSION_RATIO_EXCEEDED=O ZIP tem uma taxa de compressão suspeita e foi recusado por segurança.
import.error.ZIP_TOO_DEEP=O ZIP contém pastas aninhadas em mais níveis do que o limite permitido.
import.error.IMPORT_INTERRUPTED=A importação foi interrompida porque a aplicação foi encerrada. Envie o arquivo novamente.
import.error.IMPORT_IO_ERROR=Não foi possível gravar os arquivos da importação. Verifique o espaço em disco e tente novamente.

# Inventory warnings (GET /projects/{id}/inventory).
inventory.warning.CASE_VARIANT_PROJECT=Outro projeto deste workspace aponta para a mesma pasta, com o caminho escrito com outras maiúsculas/minúsculas.
inventory.warning.SCAN_LIMIT_REACHED=O projeto tem mais entradas do que o limite da varredura; o inventário está incompleto.
inventory.warning.PROJECT_SIZE_LIMIT_EXCEEDED=Os arquivos incluídos excedem o tamanho máximo de projeto; revise as exclusões antes de indexar.
inventory.warning.NO_INCLUDED_FILES=Nenhum arquivo será indexado: a pasta não tem arquivos suportados ou todos foram excluídos.

# Index job errors (GET /index-jobs/{id}); never include paths or file names.
index.error.SOURCE_ROOT_NOT_CONFIGURED=A raiz usada por este projeto não está mais configurada no backend.
index.error.SOURCE_DIRECTORY_NOT_FOUND=A pasta do projeto não existe mais ou não é um diretório.
index.error.SOURCE_IS_SYMLINK=O caminho do projeto passa por um link simbólico, que não é seguido por segurança.
index.error.SOURCE_NOT_READABLE=O backend não tem permissão para ler a pasta do projeto.
index.error.SOURCE_NOT_IMPORTED=O projeto não tem uma importação ZIP concluída.
index.error.SCAN_LIMIT_REACHED=O projeto tem mais entradas do que o limite da varredura; revise as exclusões antes de indexar.
index.error.PROJECT_SIZE_LIMIT_EXCEEDED=Os arquivos incluídos excedem o tamanho máximo do projeto; revise as exclusões ou o limite.
index.error.NO_INCLUDED_FILES=Nenhum arquivo para indexar: a pasta não tem arquivos suportados ou todos foram excluídos.
index.error.INDEX_IO_ERROR=Erro inesperado ao indexar o projeto. Tente novamente.
index.error.INDEX_ATTEMPTS_EXHAUSTED=A indexação foi interrompida várias vezes e não foi concluída. Tente novamente.
# Embedding provider errors (D-051); never include provider details or response bodies.
index.error.EMBEDDING_PROVIDER_UNAUTHORIZED=O provedor de embeddings recusou a credencial. Verifique a chave configurada em EMBEDDING_API_KEY e tente novamente.
index.error.EMBEDDING_PROVIDER_UNAVAILABLE=O provedor de embeddings está indisponível ou não respondeu a tempo. Tente novamente mais tarde; os trechos já processados serão reaproveitados.
index.error.EMBEDDING_RATE_LIMITED=O provedor de embeddings limitou a taxa de requisições. Aguarde alguns minutos e tente novamente; os trechos já processados serão reaproveitados.
index.error.EMBEDDING_QUOTA_EXCEEDED=A cota ou o limite de gastos da conta no provedor de embeddings foi atingido. Verifique os créditos e os limites da conta e tente novamente.
index.error.EMBEDDING_REQUEST_REJECTED=O provedor de embeddings recusou um dos trechos enviados e a indexação foi interrompida. Verifique o modelo configurado.
index.error.EMBEDDING_CHUNK_LIMIT_EXCEEDED=A indexação enviaria ao provedor de embeddings mais trechos do que o limite por indexação. Revise as exclusões ou aumente o limite.

# Answers (POST /projects/{id}/questions); never include provider details or response bodies.
answer.abstained=Não encontrei no código evidências suficientes para responder a esta pergunta.
answer.warning.NO_EVIDENCE=A busca não encontrou trechos do código para usar como evidência; o modelo não foi consultado.
answer.warning.INVALID_CITATIONS_REMOVED=O modelo fez {0} citação(ões) a evidências ou linhas que não foram enviadas; elas foram removidas da resposta.
answer.warning.NO_VALID_CITATIONS=Nenhuma citação da resposta é válida: nada nas evidências a sustenta. Confira o código antes de confiar nela.
answer.error.GENERATION_PROVIDER_UNAUTHORIZED=O provedor de geração recusou a credencial configurada no backend. Verifique GENERATION_API_KEY.
answer.error.GENERATION_PROVIDER_UNAVAILABLE=O provedor de geração está indisponível ou não respondeu a tempo. Tente novamente mais tarde.
answer.error.GENERATION_RATE_LIMITED=O provedor de geração limitou a taxa de requisições. Aguarde alguns instantes e pergunte novamente.
answer.error.GENERATION_QUOTA_EXCEEDED=A cota ou o limite de gastos da conta no provedor de geração foi atingido. Verifique os créditos e os limites da conta e tente novamente.
answer.error.GENERATION_REQUEST_REJECTED=O provedor de geração recusou o pedido. Verifique o modelo configurado ou reformule a pergunta.
answer.error.GENERATION_OUTPUT_TRUNCATED=A resposta do modelo atingiu o limite de tokens de saída antes de terminar. Reformule a pergunta de forma mais específica ou aumente o limite.
answer.error.GENERATION_REFUSED=O modelo se recusou a responder a esta pergunta.
answer.error.GENERATION_OUTPUT_INVALID=O modelo devolveu uma resposta fora do formato esperado e ela foi descartada. Tente novamente.
answer.error.EMBEDDING_PROVIDER_UNAUTHORIZED=O provedor de embeddings recusou a credencial configurada no backend. Verifique EMBEDDING_API_KEY.
answer.error.EMBEDDING_PROVIDER_UNAVAILABLE=O provedor de embeddings está indisponível ou não respondeu a tempo. Tente novamente mais tarde ou use o modo LEXICAL.
answer.error.EMBEDDING_RATE_LIMITED=O provedor de embeddings limitou a taxa de requisições. Aguarde alguns instantes e pergunte novamente.
answer.error.EMBEDDING_QUOTA_EXCEEDED=A cota ou o limite de gastos da conta no provedor de embeddings foi atingido. Verifique os créditos e os limites da conta e tente novamente.
answer.error.EMBEDDING_REQUEST_REJECTED=O provedor de embeddings recusou a pergunta. Reformule a pergunta ou verifique o modelo configurado.
answer.error.ANSWER_INTERRUPTED=A resposta foi interrompida antes de terminar, provavelmente porque o backend foi reiniciado. Pergunte novamente.

validation.required=O campo é obrigatório.
validation.file.required=Envie um arquivo ZIP não vazio no campo "file".
validation.settings.too-many-patterns=Informe no máximo 100 padrões de exclusão.
validation.settings.invalid-pattern=Padrão inválido. Use um caminho relativo com até 200 caracteres e apenas *, ** e ? como curingas, sem "!", colchetes, barra invertida, caracteres de controle nem "..".
validation.settings.unknown-rule=Regra padrão desconhecida.
validation.settings.rule-not-overridable=Esta regra padrão não pode ser desativada.
validation.settings.limit-out-of-range=O limite está fora da faixa permitida (de 1 KB até o teto configurado no backend).
validation.invalid-value=O valor informado é inválido.
validation.min=Deve ser maior ou igual a {value}.
validation.max=Deve ser menor ou igual a {value}.
validation.size.max=Deve ter no máximo {max} caracteres.
validation.name.required=O nome é obrigatório.
validation.name.too-long=O nome deve ter no máximo 100 caracteres.
validation.name.control-chars=O nome não pode conter caracteres de controle.
validation.project.not-allowed-for-zip=Não informe este campo para projetos ZIP.
validation.project.relative-path-chars=O caminho não pode conter barra invertida nem caracteres de controle.
validation.snapshot.path-prefix=O prefixo deve ser um caminho relativo, sem "/" inicial, "..", barra invertida ou caracteres de controle.
validation.snapshot.path=Informe o caminho relativo de um arquivo, sem "/" inicial, "..", barra invertida ou caracteres de controle.
validation.search.query-required=Informe a pergunta.
validation.search.query-too-long=A pergunta deve ter no máximo 2.000 caracteres.
validation.search.limit-out-of-range=O limite deve estar entre 1 e 50.
validation.search.mode-invalid=O modo deve ser LEXICAL, VECTOR ou HYBRID.
validation.question.required=Informe a pergunta.
validation.question.too-long=A pergunta deve ter no máximo 2.000 caracteres.
validation.question.max-evidence-out-of-range=A quantidade de evidências deve estar entre 1 e 20.
validation.question.retrieval-mode-invalid=O modo de busca deve ser LEXICAL, VECTOR ou HYBRID.
