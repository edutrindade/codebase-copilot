spring:
  application:
    name: codebase-copilot
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

springdoc:
  # Deterministic output so the versioned openapi.json diffs cleanly (D-023).
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health,info